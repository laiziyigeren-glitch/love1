services:
  - type: web
    name: love1-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm --workspace server run prisma:generate && npm --workspace server run prisma:push && npm --workspace server run build
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: COUPLE_LOGIN_NAME
        sync: false
      - key: COUPLE_LOGIN_PASSWORD
        sync: false
      - key: COUPLE_JWT_SECRET
        sync: false
