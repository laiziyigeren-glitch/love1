services:
  - type: web
    name: love1-api
    env: node
    plan: free
    buildCommand: npm install && npm --workspace server run prisma:generate && npm --workspace server run prisma:push && npm --workspace server run build
    startCommand: npm --workspace server run prisma:seed && npm --workspace server run start
    healthCheckPath: /api/public/spaces/default/bootstrap
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
